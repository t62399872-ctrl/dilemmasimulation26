          if (drawer) drawer.classList.toggle('hidden', !ui.mobileMenuOpen);
          if (toggle) {
            toggle.setAttribute(
              'aria-expanded',
              ui.mobileMenuOpen ? 'true' : 'false'
            );
          }
        }

        function renderApp() {
          updateNavChrome();
          renderAlert();
          var root = document.getElementById('app-root');
          if (!root) return;
          if (ui.activeTab === 'dashboard') {
            root.innerHTML = renderDashboardView();
          } else if (ui.activeTab === 'simulator') {
            root.innerHTML = renderSimulatorView();
          } else if (ui.activeTab === 'training') {
            root.innerHTML = renderTrainingLabView();
          } else {
            root.innerHTML = renderAnalyticsView();
          }
          renderCustomModal();
        }

        function stopTrainingTimer() {
          if (trainingTimer) {
            clearTimeout(trainingTimer);
            trainingTimer = null;
          }
        }

        function runTrainingStep() {
          if (state.status !== 'running') return;
          var batchSize = Math.max(
            1,
            Math.min(120, Math.ceil(state.targetEpisodes / 45))
          );

          var qTable = cloneQTable(state.qTable);
          var actionCounts = cloneActionCounts(state.actionCounts);
          var history = state.episodeHistory.slice();
          var checkpoints = Object.assign({}, state.checkpoints);
          var currentEp = state.currentEpisode;
          var lastEps = state.currentEpsilon;

          for (var b = 0; b < batchSize; b++) {
            if (currentEp >= state.targetEpisodes) break;
            var res = runSingleEpisode({
              episodeIndex: currentEp,
              totalEpisodes: state.targetEpisodes,
              qTable: qTable,
              actionCounts: actionCounts,
              weights: state.weights,
              hyperparameters: state.hyperparameters,
              recentRewards: recentRewardsRef,
              customScenarios: state.customScenarios,
            });
            currentEp++;
            lastEps = res.epsilon;
            history.push(res.metric);

            if (CHECKPOINT_MILESTONES.indexOf(currentEp) !== -1) {
              checkpoints[currentEp] = {
                milestone: currentEp,
                episodeCount: currentEp,
                qTable: cloneQTable(qTable),
                avgReward: res.metric.avgReward,
                epsilon: res.epsilon,
                actionCounts: cloneActionCounts(actionCounts),
                weights: Object.assign({}, state.weights),
                presetId: state.presetId,
                timestamp: new Date().toISOString(),
              };
            }
          }

          var done = currentEp >= state.targetEpisodes;
          if (done && !checkpoints[currentEp]) {
            checkpoints[currentEp] = {
              milestone: currentEp,
              episodeCount: currentEp,
              qTable: cloneQTable(qTable),
              avgReward:
                history.length > 0 ? history[history.length - 1].avgReward : 0,
              epsilon: lastEps,
              actionCounts: cloneActionCounts(actionCounts),
              weights: Object.assign({}, state.weights),
              presetId: state.presetId,
              timestamp: new Date().toISOString(),
            };
          }

          state.currentEpisode = currentEp;
          state.currentEpsilon = lastEps;
          state.avgReward =
            history.length > 0 ? history[history.length - 1].avgReward : 0;
          state.qTable = qTable;
          state.actionCounts = actionCounts;
          state.episodeHistory = history;
          state.checkpoints = checkpoints;
          state.lastTrainedAt = new Date().toISOString();
          if (done) {
            state.status = 'completed';
          }

          if (done) {
            stopTrainingTimer();
            persistState();
            renderApp();
          } else {
            if (ui.activeTab === 'training') {
              updateTrainingLiveDOM();
            }
            trainingTimer = setTimeout(runTrainingStep, 28);
          }
        }

        function startTraining() {
          var freshStart = state.currentEpisode >= state.targetEpisodes;
          if (freshStart) {
            recentRewardsRef = [];
            var initQ = createEmptyQTable(state.customScenarios);
            var initC = createEmptyActionCounts(state.customScenarios);
            state.currentEpisode = 0;
            state.currentEpsilon = state.hyperparameters.initialEpsilon;
            state.avgReward = 0;
            state.qTable = initQ;
            state.initialQTable = createEmptyQTable(state.customScenarios);
            state.actionCounts = initC;
            state.episodeHistory = [];
            state.checkpoints = {
              0: {
                milestone: 0,
                episodeCount: 0,
                qTable: createEmptyQTable(state.customScenarios),
                avgReward: 0,
                epsilon: state.hyperparameters.initialEpsilon,
                actionCounts: createEmptyActionCounts(state.customScenarios),
                weights: Object.assign({}, state.weights),
                presetId: state.presetId,
                timestamp: new Date().toISOString(),
              },
            };
          }
          state.status = 'running';
          renderApp();
          stopTrainingTimer();
          trainingTimer = setTimeout(runTrainingStep, 28);
        }

        function resetTraining() {
          stopTrainingTimer();
          recentRewardsRef = [];
          safeRemoveItem(STORAGE_KEY);
          var prevCustom = state.customScenarios;
          state = createInitialTrainingState();
          state.customScenarios = prevCustom;
          state.qTable = createEmptyQTable(prevCustom);
          state.initialQTable = createEmptyQTable(prevCustom);
          state.actionCounts = createEmptyActionCounts(prevCustom);
          state.checkpoints[0].qTable = createEmptyQTable(prevCustom);
          state.checkpoints[0].actionCounts = createEmptyActionCounts(prevCustom);
          ui.humanChoiceId = null;
          ui.humanReason = '';
          ui.revealedAI = false;
          persistState();
          renderApp();
        }

        function applyIRLEstimatedWeights(weights, goToTraining) {
          stopTrainingTimer();
          state.presetId = 'custom';
          state.weights = Object.assign({}, weights);
          if (state.status === 'running') state.status = 'paused';
          persistState();
          if (goToTraining) {
            ui.activeTab = 'training';
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } else {
            showAlert(
              'cyan',
              '인간 선택 기록으로부터 역추정한 윤리 가중치를 AI 보상 기준에 적용했습니다. AI 학습실에서 새 가중치로 학습을 시작해 보세요.'
            );
          }
          renderApp();
        }

        /* =========================================================
         * 14. Unified Event Delegation
         * ======================================================= */
        function closeAllTooltips() {
          var pops = document.querySelectorAll('.term-popover');
          for (var i = 0; i < pops.length; i++) {
            pops[i].classList.add('hidden');
          }
          var btns = document.querySelectorAll('[data-tooltip-toggle]');
          for (var j = 0; j < btns.length; j++) {
            btns[j].setAttribute('aria-expanded', 'false');
          }
        }

        document.addEventListener('click', function (e) {
          var target = e.target;

          // Tooltip toggle / close
          var ttClose = target.closest('[data-tooltip-close]');
          if (ttClose) {
            closeAllTooltips();
            return;
          }
          var ttToggle = target.closest('[data-tooltip-toggle]');
          if (ttToggle) {
            e.stopPropagation();
            var tid = ttToggle.getAttribute('data-tooltip-toggle');
            var pop = document.getElementById(tid);
            var wasOpen = pop && !pop.classList.contains('hidden');
            closeAllTooltips();
            if (pop && !wasOpen) {
              pop.classList.remove('hidden');
              ttToggle.setAttribute('aria-expanded', 'true');
            }
            return;
          }
          if (!target.closest('[data-tooltip-wrap]')) {
            closeAllTooltips();
          }

          if (target.id === 'dismiss-alert') {
            ui.alertBanner = null;
            renderAlert();
            return;
          }

          if (target.id === 'topbar-cta') {
            ui.activeTab =
              ui.activeTab === 'simulator' ? 'training' : 'simulator';
            ui.mobileMenuOpen = false;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            renderApp();
            return;
          }

          if (target.closest('#mobile-menu-toggle')) {
            ui.mobileMenuOpen = !ui.mobileMenuOpen;
            updateNavChrome();
            return;
          }

          var navEl = target.closest('[data-nav]');
          if (navEl) {
            ui.activeTab = navEl.getAttribute('data-nav');
            ui.mobileMenuOpen = false;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            renderApp();
            return;
          }

          var openSc = target.closest('[data-open-scenario]');
          if (openSc) {
            ui.selectedScenarioId = openSc.getAttribute('data-open-scenario');
            ui.activeTab = 'simulator';
            ui.humanChoiceId = null;
            ui.humanReason = '';
            ui.revealedAI = false;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            renderApp();
            return;
          }

          var selSc = target.closest('[data-select-scenario]');
          if (selSc) {
            ui.selectedScenarioId = selSc.getAttribute('data-select-scenario');
            ui.humanChoiceId = null;
            ui.humanReason = '';
            ui.revealedAI = false;
            renderApp();
            return;
          }

          var delSc = target.closest('[data-delete-custom]');
          if (delSc) {
            var delId = delSc.getAttribute('data-delete-custom');
            state.customScenarios = state.customScenarios.filter(function (s) {
              return s.id !== delId;
            });
            if (ui.selectedScenarioId === delId) {
              ui.selectedScenarioId = 'intersection';
              ui.humanChoiceId = null;
              ui.humanReason = '';
              ui.revealedAI = false;
            }
            if (ui.chartScenarioId === delId) {
              ui.chartScenarioId = 'intersection';
            }
            persistState();
            renderApp();
            return;
          }

          var simCat = target.closest('[data-sim-cat]');
          if (simCat) {
            ui.categoryFilter = simCat.getAttribute('data-sim-cat');
            renderApp();
            return;
          }

          var simMode = target.closest('[data-sim-mode]');
          if (simMode) {
            ui.simSubMode = simMode.getAttribute('data-sim-mode');
            renderApp();
            return;
          }

          var humanAct = target.closest('[data-human-action]');
          if (humanAct && !ui.revealedAI) {
            ui.humanChoiceId = humanAct.getAttribute('data-human-action');
            renderApp();
            return;
          }

          if (target.closest('[data-confirm-human]')) {
            if (!ui.humanChoiceId) return;
            var sc = findScenarioById(
              ui.selectedScenarioId,
              state.customScenarios
            );
            var aiBest = selectBestActionGreedy(
              sc.stateId,
              state.qTable,
              state.customScenarios
            );
            var aiId = aiBest ? aiBest.id : null;
            state.humanDecisions.push({
              id: 'hd_' + Date.now(),
              timestamp: new Date().toISOString(),
              scenarioId: sc.id,
              humanActionId: ui.humanChoiceId,
              humanReason: ui.humanReason.trim(),
              aiActionId: aiId,
              aiTrainedEpisodes: state.currentEpisode,
              presetId: state.presetId,
              agreed: aiId ? ui.humanChoiceId === aiId : null,
            });
            ui.revealedAI = true;
            persistState();
            renderApp();
            return;
          }

          if (target.closest('[data-reset-trial]')) {
            ui.humanChoiceId = null;
            ui.humanReason = '';
            ui.revealedAI = false;
            renderApp();
            return;
          }

          var targetEp = target.closest('[data-target-ep]');
          if (targetEp && state.status !== 'running') {
            state.targetEpisodes = Number(
              targetEp.getAttribute('data-target-ep')
            );
            persistState();
            renderApp();
            return;
          }

          var trainAct = target.closest('[data-train-action]');
          if (trainAct) {
            var actType = trainAct.getAttribute('data-train-action');
            if (actType === 'start') startTraining();
            else if (actType === 'pause') {
              stopTrainingTimer();
              state.status = 'paused';
              persistState();
              renderApp();
            } else if (actType === 'resume') {
              state.status = 'running';
              renderApp();
              stopTrainingTimer();
              trainingTimer = setTimeout(runTrainingStep, 28);
            }
            return;
          }

          var selPreset = target.closest('[data-select-preset]');
          if (selPreset && state.status !== 'running') {
            var pid = selPreset.getAttribute('data-select-preset');
            state.presetId = pid;
            state.weights = Object.assign({}, ETHICAL_PRESETS[pid].weights);
            persistState();
            renderApp();
            return;
          }

          if (target.closest('[data-save-snapshot]')) {
            var defaultName =
              ETHICAL_PRESETS[state.presetId].name +
              ' (' +
              state.currentEpisode.toLocaleString() +
              '회)';
            var name = ui.snapshotName.trim() || defaultName;
            state.savedExperiments.unshift({
              id: 'exp_' + Date.now(),
              name: name,
              createdAt: new Date().toISOString(),
              presetId: state.presetId,
              weights: Object.assign({}, state.weights),
              hyperparameters: Object.assign({}, state.hyperparameters),
              totalEpisodes: state.currentEpisode,
              avgReward: state.avgReward,
              qTable: cloneQTable(state.qTable),
              episodeHistory: state.episodeHistory.slice(-240),
            });
            ui.snapshotName = '';
            ui.saveFeedback = '현재 학습 정책을 실험 스냅샷으로 저장했습니다.';
            persistState();
            renderApp();
            setTimeout(function () {
              ui.saveFeedback = null;
              if (ui.activeTab === 'training') renderApp();
            }, 3000);
            return;
          }

          var applyIrl = target.closest('[data-apply-irl]');
          if (applyIrl) {
            var irl = estimateWeightsFromHumanDecisions(
              state.humanDecisions,
              state.customScenarios
            );
            if (irl.sampleCount === 0) return;
            applyIRLEstimatedWeights(
              irl.estimatedWeights,
              applyIrl.getAttribute('data-apply-irl') === 'train'
            );
            return;
          }

          var loadExp = target.closest('[data-load-exp]');
          if (loadExp) {
            var expId = loadExp.getAttribute('data-load-exp');
            var exp = state.savedExperiments.find(function (x) {
              return x.id === expId;
            });
            if (exp) {
              stopTrainingTimer();
              state.status = 'completed';
              state.presetId = exp.presetId;
              state.weights = Object.assign({}, exp.weights);
              state.hyperparameters = Object.assign({}, exp.hyperparameters);
              state.targetEpisodes = exp.totalEpisodes;
              state.currentEpisode = exp.totalEpisodes;
              state.avgReward = exp.avgReward;
              state.qTable = ensureQTableHasStates(
                exp.qTable,
                state.customScenarios
              );
              state.episodeHistory = exp.episodeHistory.slice();
              persistState();
              renderApp();
            }
            return;
          }

          var chartSc = target.closest('[data-chart-scenario]');
          if (chartSc) {
            ui.chartScenarioId = chartSc.getAttribute('data-chart-scenario');
            renderApp();
            return;
          }

          if (target.closest('[data-download-html]')) {
            ui.mobileMenuOpen = false;
            updateNavChrome();
            downloadStandaloneHTML();
            return;
          }

          if (target.closest('[data-export-csv]')) {
            exportExperimentCSV(state);
            return;
          }

          if (target.closest('[data-reset-training]')) {
            resetTraining();
            return;
          }

          if (target.closest('[data-open-builder]')) {
            ui.builderOpen = true;
            renderCustomModal();
            return;
          }

          if (
            target.closest('[data-close-builder]') ||
            target.id === 'modal-backdrop'
          ) {
            ui.builderOpen = false;
            renderCustomModal();
            return;
          }

          var tplBtn = target.closest('[data-tpl-idx]');
          if (tplBtn) {
            var tIdx = Number(tplBtn.getAttribute('data-tpl-idx'));
            ui.builderDraft = cloneTemplate(BUILDER_TEMPLATES[tIdx]);
            renderCustomModal();
            return;
          }

          var ruleBtn = target.closest('[data-draft-rule]');
          if (ruleBtn) {
            var rIdx = Number(ruleBtn.getAttribute('data-draft-idx'));
            ui.builderDraft.actions[rIdx].ruleStatus =
              ruleBtn.getAttribute('data-draft-rule');
            renderCustomModal();
            return;
          }
        });

          var t = e.target;

          if (t.id === 'human-reason-input') {
            ui.humanReason = t.value;

          if (t.id === 'snapshot-name-input') {
            ui.snapshotName = t.value;

            ui.builderDraft.title = t.value;

          if (t.id === 'builder-env') {
            ui.builderDraft.environmentSummary = t.value;
            return;

          if (t.id === 'builder-desc') {
            ui.builderDraft.description = t.value;

          if (t.id === 'builder-vis') {
            ui.builderDraft.visibilityScore = Number(t.value);
            var vLbl = document.getElementById('builder-vis-lbl');
            if (vLbl) vLbl.textContent = ui.builderDraft.visibilityScore + '/100';
            updateAllDraftPreviews();
            return;
          }

          var wKey = t.getAttribute('data-weight-slider');
          if (wKey && state.status !== 'running') {
            state.presetId = 'custom';
            state.weights = normalizeWeights(
              state.weights,
              wKey,
              Number(t.value)
            );
            WEIGHT_KEYS.forEach(function (k) {
              var lbl = document.querySelector('[data-weight-label="' + k + '"]');
              if (lbl) lbl.textContent = state.weights[k] + '%';
              var inp = document.querySelector('[data-weight-slider="' + k + '"]');
              if (inp && inp !== t) inp.value = state.weights[k];
            });
            return;
          }

          var hpKey = t.getAttribute('data-hp-slider');
          if (hpKey && state.status !== 'running') {
            state.hyperparameters[hpKey] = Number(t.value);
            var hLbl = document.querySelector('[data-hp-label="' + hpKey + '"]');
            if (hLbl) hLbl.textContent = Number(t.value).toFixed(2);
            return;
          }

          var dfField = t.getAttribute('data-draft-field');
          if (dfField) {
            var idx = Number(t.getAttribute('data-draft-idx'));
            var act = ui.builderDraft.actions[idx];
            if (!act) return;
            if (dfField === 'shortLabel') {
              act.shortLabel = t.value;
              act.label = t.value;
            } else if (dfField === 'count') {
              act.count = Math.max(1, Math.min(5, Number(t.value) || 1));
              updateDraftPreviewCard(idx);
            } else if (dfField === 'avgAge') {
              act.avgAge = Number(t.value);
              var ageLbl = document.querySelector(
                '[data-draft-age-lbl="' + idx + '"]'
              );
              if (ageLbl) {
                ageLbl.textContent =
                  act.avgAge + '세 · 생명 ' + computeLifeLevelFromAge(act.avgAge);
              }
              updateDraftPreviewCard(idx);
            } else if (dfField === 'vulnerability') {
              act.vulnerability = Number(t.value);
              var vulnLbl = document.querySelector(
                '[data-draft-vuln-lbl="' + idx + '"]'
              );
              if (vulnLbl) vulnLbl.textContent = act.vulnerability + '/100';
              updateDraftPreviewCard(idx);
            }
          }
        });

        function updateDraftPreviewCard(idx) {
          var act = ui.builderDraft.actions[idx];
          if (!act) return;
          var def = ACTOR_TYPE_DEFAULTS[act.actorType];
          var prev = computeRisksFromActors({
            actors: [
              {
                type: act.actorType,
                label: def.label,
                count: act.count,
                avgAge: act.avgAge,
                lifeLevel: computeLifeLevelFromAge(act.avgAge),
                vulnerability: act.vulnerability,
                ruleStatus: act.ruleStatus,
              },
            ],
            trajectoryType: act.trajectoryType,
            visibilityScore: ui.builderDraft.visibilityScore,
          });
          var box = document.querySelector('[data-draft-preview="' + idx + '"]');
          if (box) {
            box.innerHTML =
              '<span>보행자: ' +
              prev.pedestrian +
              '</span><span>탑승자: ' +
              prev.passenger +
              '</span><span>법규위반: ' +
              prev.ruleViolation +
              '</span><span>생명지수: ' +
              prev.lifeExpectancy +
              '</span>';
          }
        }

        function updateAllDraftPreviews() {
          for (var i = 0; i < ui.builderDraft.actions.length; i++) {
            updateDraftPreviewCard(i);
          }
        }

        document.addEventListener('change', function (e) {
          var t = e.target;

          if (t.id === 'left-checkpoint') {
            ui.leftMilestone = Number(t.value);
            renderApp();
            return;
          }
          if (t.id === 'right-checkpoint') {
            ui.rightMilestone = Number(t.value);
            renderApp();
            return;
          }
          if (t.id === 'analytics-load-exp' && t.value) {
            var exp = state.savedExperiments.find(function (x) {
              return x.id === t.value;
            });
            if (exp) {
              stopTrainingTimer();
              state.status = 'completed';
              state.presetId = exp.presetId;
              state.weights = Object.assign({}, exp.weights);
              state.hyperparameters = Object.assign({}, exp.hyperparameters);
              state.targetEpisodes = exp.totalEpisodes;
              state.currentEpisode = exp.totalEpisodes;
              state.avgReward = exp.avgReward;
              state.qTable = ensureQTableHasStates(
                exp.qTable,
                state.customScenarios
              );
              state.episodeHistory = exp.episodeHistory.slice();
              persistState();
              renderApp();
            }
            return;
          }

          if (
            t.hasAttribute('data-weight-slider') ||
            t.hasAttribute('data-hp-slider')
          ) {
            persistState();
            renderApp();
            return;
          }

          var dfField = t.getAttribute('data-draft-field');
          if (dfField === 'trajectoryType' || dfField === 'actorType') {
            var idx = Number(t.getAttribute('data-draft-idx'));
            var act = ui.builderDraft.actions[idx];
            if (!act) return;
            if (dfField === 'trajectoryType') {
              act.trajectoryType = t.value;
              updateDraftPreviewCard(idx);
            } else {
              act.actorType = t.value;
              var def = ACTOR_TYPE_DEFAULTS[t.value];
              act.avgAge = def.defaultAge;
              act.vulnerability = def.defaultVulnerability;
              var dirPrefix =
                act.trajectoryType === 'straight'
                  ? '직진'
                  : act.trajectoryType === 'left'
                  ? '좌회피'
                  : act.trajectoryType === 'right'
                  ? '우회피'
                  : '한계 급제동';
              act.shortLabel =
                act.trajectoryType === 'brake'
                  ? '한계 급제동'
                  : dirPrefix + ' (' + def.label.split('(')[0] + ' ' + act.count + ')';
              act.label =
                act.trajectoryType === 'brake'
                  ? '한계 급제동 (' + def.label + ' ' + act.count + '명)'
                  : dirPrefix + ' 경로 (' + def.label + ' ' + act.count + '명)';
              renderCustomModal();
            }
          }
        });

        document.addEventListener('submit', function (e) {
          if (e.target && e.target.id === 'custom-builder-form') {
            e.preventDefault();
            var d = ui.builderDraft;
            var uid = 'custom_' + Date.now();
            var builtActions = d.actions.map(function (draft, idx) {
              var def = ACTOR_TYPE_DEFAULTS[draft.actorType];
              var lifeLevel = computeLifeLevelFromAge(draft.avgAge);
              var actor = {
                type: draft.actorType,
                label: def.label,
                count: draft.count,
                avgAge: draft.avgAge,
                lifeLevel: lifeLevel,
                vulnerability: draft.vulnerability,
                ruleStatus: draft.ruleStatus,
              };
              var risks = computeRisksFromActors({
                actors: [actor],
                trajectoryType: draft.trajectoryType,
                visibilityScore: d.visibilityScore,
              });
              return {
                id: uid + '_act_' + idx,
                label:
                  (draft.label || '').trim() ||
                  def.label + ' ' + draft.count + '명 경로',
                shortLabel:
                  (draft.shortLabel || '').trim() ||
                  def.label + ' ' + draft.count,
                description:
                  (draft.description || '').trim() ||
                  def.label + ' ' + draft.count + '명이 위치한 경로입니다.',
                trajectoryType: draft.trajectoryType,
                actors: [actor],
                risks: risks,
              };
            });

            var newScenario = {
              id: uid,
              stateId: uid,
              code:
                'USR-' +
                String(state.customScenarios.length + 1).padStart(2, '0'),
              category: '사용자 생성',
              isCustom: true,
              title:
                (d.title || '').trim() ||
                '사용자 정의 상황 ' + (state.customScenarios.length + 1),
              subtitle: '사용자 맞춤 4방향(직진·좌·우·급제동) 설정 딜레마',
              environmentSummary:
                (d.environmentSummary || '').trim() ||
                '사용자 설정 가상 도로 환경',
              description:
                (d.description || '').trim() ||
                '사용자가 직접 4개 방향의 대상, 인원수, 연령, 법규 위반 여부를 구성한 가상 딜레마입니다.',
              roadCondition:
                d.visibilityScore < 55
                  ? '저시정·습윤 노면'
                  : '제동 불가 (사용자 설정)',
              visibilityScore: d.visibilityScore,
              trafficDensity: builtActions
                .map(function (a) {
                  return a.actors[0].label + ' ' + a.actors[0].count + '명';
                })
                .join(' / '),
              actions: builtActions,
            };

            state.customScenarios = state.customScenarios.concat([newScenario]);
            state.qTable = ensureQTableHasStates(
              state.qTable,
              state.customScenarios
            );
            state.initialQTable = ensureQTableHasStates(
              state.initialQTable,
              state.customScenarios
            );

            ui.builderOpen = false;
            ui.categoryFilter = '전체';
            ui.selectedScenarioId = newScenario.id;
            ui.humanChoiceId = null;
            ui.humanReason = '';
            ui.revealedAI = false;
            persistState();
            renderApp();
          }
        });

        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') {
            closeAllTooltips();
            if (ui.builderOpen) {
              ui.builderOpen = false;
              renderCustomModal();
            }
          }
        });

        /* =========================================================
         * 15. Initial Render
         * ======================================================= */
        renderApp();
      })();
    </script>
  

</body></html>
