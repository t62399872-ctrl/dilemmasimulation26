    <style>
      :root {
        --font-sans: "Plus Jakarta Sans", "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        --bg-canvas: #060a12;
        --bg-panel: #0a1120;
        --bg-inset: #060a12;
        --bg-elevated: #0f182d;
        --border-subtle: #1e293b;
        --border-muted: #334155;
        --text-primary: #f1f5f9;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --text-dim: #64748b;
        --cyan: #22d3ee;
        --cyan-bg: rgba(34, 211, 238, 0.12);
        --cyan-border: rgba(34, 211, 238, 0.45);
        --blue: #3b82f6;
        --amber: #f59e0b;
        --amber-bg: rgba(245, 158, 11, 0.12);
        --amber-border: rgba(245, 158, 11, 0.42);
        --emerald: #10b981;
        --emerald-bg: rgba(16, 185, 129, 0.12);
        --emerald-border: rgba(16, 185, 129, 0.42);
        --rose: #f43f5e;
        --rose-bg: rgba(244, 63, 94, 0.12);
        --rose-border: rgba(244, 63, 94, 0.42);
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      html {
        font-family: var(--font-sans);
        background-color: var(--bg-canvas);
        color: var(--text-primary);
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: var(--bg-canvas);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
      }

      button, input, select, textarea {
        font-family: inherit;
        color: inherit;
      }

      button {
        cursor: pointer;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 2px;
      }

      .font-mono-tabular {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }

      .container {
        width: 100%;
        max-width: 1440px;
        margin: 0 auto;
        padding-left: 16px;
        padding-right: 16px;
      }
      @media (min-width: 640px) {
        .container { padding-left: 24px; padding-right: 24px; }
      }
      @media (min-width: 1024px) {
        .container { padding-left: 32px; padding-right: 32px; }
      }

      /* Top Navigation Bar (3-Zone Contract) */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 40;
        border-bottom: 1px solid rgba(30, 41, 59, 0.9);
        background: rgba(6, 10, 18, 0.94);
        backdrop-filter: blur(10px);
      }

      .topbar-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding-top: 12px;
        padding-bottom: 12px;
      }

      .brand-btn {
        background: none;
        border: none;
        padding: 0;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #fff;
        white-space: nowrap;
        flex-shrink: 0;
        transition: color 0.15s ease;
      }
      .brand-btn:hover { color: #67e8f9; }

      .nav-links {
        display: none;
        align-items: center;
        gap: 28px;
      }
      @media (min-width: 768px) {
        .nav-links { display: flex; }
      }

      .nav-link {
        position: relative;
        background: none;
        border: none;
        padding: 6px 0;
        font-size: 14px;
        font-weight: 500;
        color: var(--text-secondary);
        white-space: nowrap;
        flex-shrink: 0;
        transition: color 0.15s ease;
      }
      .nav-link:hover { color: #fff; }
      .nav-link.active { color: #67e8f9; }
      .nav-link.active::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -13px;
        height: 2px;
        background: var(--cyan);
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }

      .mobile-menu-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 8px;
        border: 1px solid var(--border-subtle);
        background: transparent;
        color: var(--text-primary);
      }
      @media (min-width: 768px) {
        .mobile-menu-btn { display: none; }
      }
      @media (max-width: 767px) {
        .topbar-download-btn { display: none; }
      }

      .mobile-drawer {
        border-top: 1px solid var(--border-subtle);
        background: #080e1a;
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      @media (min-width: 768px) {
        .mobile-drawer { display: none !important; }
      }

      .mobile-nav-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 44px;
        padding: 8px 12px;
        border-radius: 8px;
        border: none;
        background: transparent;
        font-size: 14px;
        font-weight: 500;
        color: var(--text-secondary);
        text-align: left;
      }
      .mobile-nav-item.active {
        background: var(--cyan-bg);
        color: #67e8f9;
      }

      /* Main & Footer */
      main {
        flex: 1;
        padding-top: 24px;
        padding-bottom: 36px;
      }

      footer {
        border-top: 1px solid rgba(30, 41, 59, 0.85);
        background: #05080f;
        padding: 20px 0;
        font-size: 12px;
        color: var(--text-muted);
      }
      .footer-inner {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      @media (min-width: 640px) {
        .footer-inner {
          flex-direction: row;
          align-items: center;
          justify-content: space-between;
        }
      }

      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 40px;
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        border: 1px solid transparent;
        transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .btn-lg {
        min-height: 44px;
        padding: 10px 20px;
        font-size: 14px;
      }
      .btn-sm {
        min-height: 34px;
        padding: 6px 12px;
        font-size: 12px;
      }
      .btn-primary {
        background: #06b6d4;
        color: #020617;
      }
      .btn-primary:hover:not(:disabled) { background: var(--cyan); }
      .btn-secondary {
        background: var(--bg-elevated);
        border-color: var(--border-muted);
        color: var(--text-primary);
      }
      .btn-secondary:hover:not(:disabled) {
        border-color: var(--cyan-border);
        color: #67e8f9;
      }
      .btn-cyan-soft {
        background: var(--cyan-bg);
        border-color: var(--cyan-border);
        color: #a5f3fc;
      }
      .btn-cyan-soft:hover:not(:disabled) {
        background: rgba(34, 211, 238, 0.22);
      }
      .btn-amber {
        background: #fbbf24;
        color: #020617;
      }
      .btn-amber:hover:not(:disabled) { background: #fcd34d; }
      .btn-rose-soft {
        background: var(--rose-bg);
        border-color: var(--rose-border);
        color: #fecdd3;
      }
      .btn-rose-soft:hover:not(:disabled) {
        background: rgba(244, 63, 94, 0.22);
      }
      .btn-text {
        background: none;
        border: none;
        padding: 4px 6px;
        min-height: auto;
        color: var(--cyan);
        font-size: 12px;
        font-weight: 600;
      }
      .btn-text:hover { color: #a5f3fc; }

      /* Cards, Sections, Banners */
      .panel {
        border-radius: 12px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-panel);
        padding: 20px;
      }
      .panel-lg {
        padding: 24px;
      }
      @media (min-width: 640px) {
        .panel-lg { padding: 32px; }
      }
      .inset-box {
        border-radius: 10px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-inset);
        padding: 16px;
      }

      .banner {
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 20px;
      }
      .banner-cyan {
        border: 1px solid var(--cyan-border);
        background: var(--cyan-bg);
        color: #cffafe;
      }
      .banner-amber {
        border: 1px solid var(--amber-border);
        background: var(--amber-bg);
        color: #fef3c7;
      }
      .banner-rose {
        border: 1px solid var(--rose-border);
        background: var(--rose-bg);
        color: #ffe4e6;
      }

      /* Grids */
      .stack-sm > * + * { margin-top: 10px; }
      .stack-md > * + * { margin-top: 16px; }
      .stack-lg > * + * { margin-top: 24px; }
      .stack-xl > * + * { margin-top: 32px; }

      .grid-12 {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
      }
      @media (min-width: 1024px) {
        .grid-12 {
          grid-template-columns: repeat(12, minmax(0, 1fr));
        }
        .lg-col-4 { grid-column: span 4 / span 4; }
        .lg-col-5 { grid-column: span 5 / span 5; }
        .lg-col-6 { grid-column: span 6 / span 6; }
        .lg-col-7 { grid-column: span 7 / span 7; }
        .lg-col-8 { grid-column: span 8 / span 8; }
        .lg-col-12 { grid-column: span 12 / span 12; }
      }

      .grid-2 { display: grid; grid-template-columns: 1fr; gap: 16px; }
      .grid-3 { display: grid; grid-template-columns: 1fr; gap: 16px; }
      .grid-4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      @media (min-width: 640px) {
        .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      @media (min-width: 1024px) {
        .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      }

      /* Segmented Controls & Tabs */
      .seg-group {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 4px;
        border-radius: 10px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-panel);
      }
      .seg-btn {
        border: none;
        border-radius: 7px;
        padding: 7px 14px;
        font-size: 12px;
        font-weight: 600;
        background: transparent;
        color: var(--text-muted);
        white-space: nowrap;
        transition: background-color 0.15s ease, color 0.15s ease;
      }
      .seg-btn:hover { color: #fff; }
      .seg-btn.active {
        background: #06b6d4;
        color: #020617;
      }

      .chip-btn {
        border-radius: 8px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-panel);
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-secondary);
        white-space: nowrap;
      }
      .chip-btn:hover { border-color: var(--border-muted); color: #fff; }
      .chip-btn.active {
        border-color: var(--cyan);
        background: var(--cyan-bg);
        color: #a5f3fc;
      }

      /* Scenario Cards & Action Cards */
      .scenario-card {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        text-align: left;
        border-radius: 12px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-panel);
        padding: 18px;
        transition: border-color 0.15s ease, background-color 0.15s ease;
      }
      .scenario-card:hover {
        border-color: rgba(34, 211, 238, 0.55);
        background: #0d1629;
      }

      .scenario-pill-btn {
        position: relative;
        text-align: left;
        border-radius: 10px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-panel);
        padding: 12px;
        transition: border-color 0.15s ease, background-color 0.15s ease;
      }
      .scenario-pill-btn:hover { border-color: var(--border-muted); }
      .scenario-pill-btn.active {
        border-color: var(--cyan);
        background: rgba(6, 182, 212, 0.1);

      .action-choice-btn {
        width: 100%;
        text-align: left;
        border-radius: 10px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-inset);
        padding: 14px;
        transition: border-color 0.15s ease, background-color 0.15s ease;

      .action-choice-btn:hover { border-color: var(--border-muted); }
      .action-choice-btn.selected {
        border-color: var(--blue);
        background: rgba(59, 130, 246, 0.12);
      }

      /* Form Inputs & Sliders */
      .input-field, .select-field, .textarea-field {
        width: 100%;
        border-radius: 8px;
        border: 1px solid var(--border-muted);
        background: var(--bg-inset);
        padding: 8px 12px;
        font-size: 13px;
        color: var(--text-primary);
      }
      .input-field:focus, .select-field:focus, .textarea-field:focus {
        border-color: var(--cyan);
        outline: none;
      }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        background: transparent;
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 6px;
        border-radius: 3px;
        background: #1e293b;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 16px;
        height: 16px;
        margin-top: -5px;
        border-radius: 50%;
        background: #22d3ee;
        border: 2px solid #060a12;
        box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.45);
      }
      input[type="range"]:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      /* Progress Bars */
      .progress-track {
        width: 100%;
        height: 8px;
        border-radius: 999px;
        background: #1e293b;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        border-radius: 999px;
        background: #06b6d4;
        transition: width 0.15s ease;
      }

      /* Tables */
      .table-wrap {
        width: 100%;
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
        font-size: 12px;
      }
      th {
        padding: 10px 8px;
        border-bottom: 1px solid var(--border-subtle);
        color: var(--text-muted);
        font-weight: 500;
        white-space: nowrap;
      }
      td {
        padding: 10px 8px;
        border-bottom: 1px solid rgba(30, 41, 59, 0.65);
        vertical-align: middle;
      }
      tr.row-highlight {
        background: rgba(6, 182, 212, 0.1);
      }

      /* Tooltip Popover */
      .term-wrap {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        vertical-align: middle;
      }
      .term-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        border: none;
        border-radius: 4px;
        background: transparent;
        color: var(--text-muted);
        padding: 0;
      }
      .term-btn:hover {
        background: #1e293b;
        color: var(--cyan);
      }
      .term-popover {
        position: absolute;
        left: 0;
        top: calc(100% + 8px);
        z-index: 60;
        width: 280px;
        border-radius: 10px;
        border: 1px solid var(--border-muted);
        background: #0b1324;
        padding: 14px;
        text-align: left;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      }

      /* Modal */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 70;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.78);
        backdrop-filter: blur(4px);
        padding: 16px;
      }
      .modal-card {
        width: 100%;
        max-width: 1020px;
        max-height: 90vh;
        overflow-y: auto;
        border-radius: 14px;
        border: 1px solid var(--border-muted);
        background: var(--bg-panel);
        padding: 24px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
      }

      /* Utility helpers */
      .flex-between {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .flex-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .text-cyan { color: #67e8f9; }
      .text-blue { color: #93c5fd; }
      .text-amber { color: #fcd34d; }
      .text-emerald { color: #6ee7b7; }
      .text-rose { color: #fda4af; }
      .text-muted { color: var(--text-muted); }
      .text-dim { color: var(--text-dim); }
      .chart-box {
        width: 100%;
        height: 245px;
      }
      .empty-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        min-height: 220px;
        border-radius: 10px;
        border: 1px dashed var(--border-subtle);
        background: var(--bg-inset);
        padding: 20px;
        text-align: center;
      }
      .divider-top {
        border-top: 1px solid var(--border-subtle);
        padding-top: 14px;
      }
      .divider-bottom {
        border-bottom: 1px solid var(--border-subtle);
        padding-bottom: 14px;
      }
      .hidden { display: none !important; }
    </style>

        function computeRisksFromActors(params) {
          var actors = params.actors || [];
          var trajectoryType = params.trajectoryType;
          var visibilityScore = params.visibilityScore;

          var pedCount = 0;
          var roadUserCount = 0;
          var passengerImpact = false;
          var maxLife = 15;
          var weightedLifeSum = 0;
          var lifeDenom = 0;
          var maxVuln = 15;
          var anyViolator = false;

          for (var i = 0; i < actors.length; i++) {
            var actor = actors[i];
            var c = Math.max(1, actor.count || 1);
            if (
              actor.type === 'child' ||
              actor.type === 'adult' ||
              actor.type === 'elderly' ||
              actor.type === 'disabled'
            ) {
              pedCount += c;
            } else if (actor.type === 'cyclist' || actor.type === 'vehicle') {
              roadUserCount += c;
            } else if (actor.type === 'passenger') {
              passengerImpact = true;
            }
            if (actor.lifeLevel > maxLife) maxLife = actor.lifeLevel;
            weightedLifeSum += actor.lifeLevel * c;
            lifeDenom += c;
            if (actor.vulnerability > maxVuln) maxVuln = actor.vulnerability;
            if (actor.ruleStatus === 'violator') anyViolator = true;
          }

          var passengerBase =
            trajectoryType === 'brake'
              ? 64
              : passengerImpact
              ? 72
              : trajectoryType === 'left' || trajectoryType === 'right'
              ? 32
              : 14;
          var pedestrianRisk = Math.min(
            95,
            pedCount === 0 ? 14 : 32 + pedCount * 22
          );
          var roadUserRisk = Math.min(
            95,
            (trajectoryType === 'brake' ? 54 : 16) + roadUserCount * 26
          );
          var ruleViolation = 12;
          if (trajectoryType === 'left' || trajectoryType === 'right') {
            ruleViolation = passengerImpact ? 32 : anyViolator ? 46 : 78;
          } else if (trajectoryType === 'straight') {
            ruleViolation = anyViolator ? 10 : 38;
          } else if (trajectoryType === 'brake') {
            ruleViolation = 6;
          }

          var uncertainty = Math.min(
            95,
            Math.max(
              14,
              Math.round(
                (100 - visibilityScore) * 0.75 +
                  (trajectoryType === 'brake' ? 18 : 20)
              )
            )
          );
          var avgLife = lifeDenom > 0 ? weightedLifeSum / lifeDenom : 18;
          var lifeExpectancy = Math.round(maxLife * 0.65 + avgLife * 0.35);
          var vulnerability =
            actors.length > 0
              ? Math.min(98, maxVuln)
              : trajectoryType === 'brake'
              ? 24
              : 15;

          return {
            passenger: passengerBase,
            pedestrian: pedestrianRisk,
            roadUser: roadUserRisk,
            ruleViolation: ruleViolation,
            uncertainty: uncertainty,
            lifeExpectancy: lifeExpectancy,
            vulnerability: vulnerability,

            return { action: actions[idx], explored: true };
          }
          var best = selectBestActionGreedy(stateId, qTable, customScenarios);
          return { action: best || actions[0], explored: false };
        }

        function isQTableUntrainedForState(stateId, qTable) {
          var row = qTable[stateId];
          if (!row) return true;
          var vals = Object.values(row);
          for (var i = 0; i < vals.length; i++) {
            if (Math.abs(vals[i]) >= 1e-7) return false;
          }
          return true;
        }

        function runSingleEpisode(params) {
          var episodeIndex = params.episodeIndex;
          var totalEpisodes = params.totalEpisodes;
          var qTable = params.qTable;
          var actionCounts = params.actionCounts;
          var weights = params.weights;
          var hp = params.hyperparameters;
          var recentRewards = params.recentRewards;
          var customScenarios = params.customScenarios || [];

          var epsilon = computeEpsilon(
            episodeIndex,
            totalEpisodes,
            hp.initialEpsilon,
            hp.minEpsilon
          );
          var allScenarios = getAllScenarios(customScenarios);
          var scenario = allScenarios[episodeIndex % allScenarios.length];

          var currentState = scenario.stateId;
          var episodeReturn = 0;
          var firstActionId = '';
          var firstExplored = false;
          var steps = 0;
          var maxSteps = 4;

          while (steps < maxSteps) {
            var picked = selectActionEpsilonGreedy(
              currentState,
              qTable,
              epsilon,
              customScenarios
            );
            var action = picked.action;
            var explored = picked.explored;

            if (steps === 0) {
              firstActionId = action.id;
              firstExplored = explored;
            }
            if (!actionCounts[currentState]) {
              actionCounts[currentState] = {};
            }
            actionCounts[currentState][action.id] =
              (actionCounts[currentState][action.id] || 0) + 1;

            var reward = sampleStochasticReward(action, weights);
            episodeReturn += reward * Math.pow(hp.discountFactor, steps);

            var nextState = action.nextState;
            var maxNextQ = 0;
            if (nextState && qTable[nextState]) {
              var nextValues = Object.values(qTable[nextState]);
              if (nextValues.length > 0) {
                maxNextQ = Math.max.apply(null, nextValues);
              }
            }

            if (!qTable[currentState]) qTable[currentState] = {};
            var oldQ = qTable[currentState][action.id] || 0;
            var tdTarget = reward + hp.discountFactor * maxNextQ;
            var updatedQ = oldQ + hp.learningRate * (tdTarget - oldQ);
            qTable[currentState][action.id] = Number(updatedQ.toFixed(4));

            if (!nextState) break;
            currentState = nextState;
            steps++;
          }

          recentRewards.push(episodeReturn);
          if (recentRewards.length > 50) recentRewards.shift();
          var movingAvg =
            recentRewards.reduce(function (s, v) {
              return s + v;
            }, 0) / recentRewards.length;

          return {
            epsilon: epsilon,
            metric: {
              episode: episodeIndex + 1,
              reward: Number(episodeReturn.toFixed(2)),
              avgReward: Number(movingAvg.toFixed(2)),
              epsilon: epsilon,
              scenarioId: scenario.id,
              actionId: firstActionId,
              explored: firstExplored,
            },
          };
        }

        function explainCheckpointDifference(params) {
          var scenario = findScenarioById(
            params.scenarioId,
            params.customScenarios
          );
          var leftBest = selectBestActionGreedy(
            scenario.stateId,
            params.leftQTable,
            params.customScenarios
          );
          var rightBest = selectBestActionGreedy(
            scenario.stateId,
            params.rightQTable,
            params.customScenarios
          );

          var leftActionId = leftBest ? leftBest.id : null;
          var rightActionId = rightBest ? rightBest.id : null;

          if (!leftActionId && !rightActionId) {
            return {
              changed: false,
              leftActionId: null,
              rightActionId: null,
              summary:
                '두 비교 대상 모두 아직 강화학습이 수행되지 않아 모든 행동의 Q-value가 0.00인 초기 상태입니다.',
            };
          }

          if (!leftActionId && rightActionId && rightBest) {
            var rightQ =
              (params.rightQTable[scenario.stateId] &&
                params.rightQTable[scenario.stateId][rightActionId]) ||
              0;
            var sortedWeights = WEIGHT_KEYS.map(function (k) {
              return [k, params.weights[k]];
            }).sort(function (a, b) {
              return b[1] - a[1];
            });
            var topKey = sortedWeights[0][0];
            var topVal = sortedWeights[0][1];
            return {
              changed: true,
              leftActionId: null,
              rightActionId: rightActionId,
              summary:
                params.leftEpisode.toLocaleString() +
                '회 시점에는 학습된 정책이 없었으나, ' +
                params.rightEpisode.toLocaleString() +
                "회 학습 후 '" +
                rightBest.shortLabel +
                "'의 Q-value가 " +
                rightQ.toFixed(2) +
                '로 수렴하며 최적 행동으로 선택되었습니다. (핵심 가중치: ' +
                WEIGHT_LABELS[topKey] +
                ' ' +
                topVal +
                '%)',
            };
          }

          if (leftActionId === rightActionId && rightBest) {
            var leftQ =
              (params.leftQTable[scenario.stateId] &&
                params.leftQTable[scenario.stateId][leftActionId]) ||
              0;
            var rQ =
              (params.rightQTable[scenario.stateId] &&
                params.rightQTable[scenario.stateId][rightActionId]) ||
              0;
            var delta = rQ - leftQ;
            return {
              changed: false,
              leftActionId: leftActionId,
              rightActionId: rightActionId,
              summary:
                params.leftEpisode.toLocaleString() +
                '회 시점과 ' +
                params.rightEpisode.toLocaleString() +
                "회 시점 모두 '" +
                rightBest.shortLabel +
                "' 선택이 유지되었습니다. Q-value는 " +
                leftQ.toFixed(2) +
                '에서 ' +
                rQ.toFixed(2) +
                '로 ' +
                (delta >= 0 ? '+' : '') +
                delta.toFixed(2) +
                ' 변화하며 기존 정책의 신뢰도가 ' +
                (delta >= 0 ? '강화' : '재조정') +
                '되었습니다.',
            };
          }

          if (leftBest && rightBest) {
            var leftQAfter =
              (params.rightQTable[scenario.stateId] &&
                params.rightQTable[scenario.stateId][leftBest.id]) ||
              0;
            var rightQAfter =
              (params.rightQTable[scenario.stateId] &&
                params.rightQTable[scenario.stateId][rightBest.id]) ||
              0;
            var gap = rightQAfter - leftQAfter;
            return {
              changed: true,
              leftActionId: leftActionId,
              rightActionId: rightActionId,
              summary:
                params.leftEpisode.toLocaleString() +
                "회에서는 탐험 부족 또는 초기 오차로 '" +
                leftBest.shortLabel +
                "'이 선택되었으나, " +
                params.rightEpisode.toLocaleString() +
                "회 누적 경험 결과 '" +
                rightBest.shortLabel +
                "'의 Q-value(" +
                rightQAfter.toFixed(2) +
                ")가 '" +
                leftBest.shortLabel +
                "'(" +
                leftQAfter.toFixed(2) +
                ')보다 ' +
                gap.toFixed(2) +
                '만큼 높아져 판단이 전환되었습니다.',
            };
          }

          return {
            changed: false,
            leftActionId: leftActionId,
            rightActionId: rightActionId,
            summary:
              '비교 대상 체크포인트의 Q-table 데이터를 기반으로 정책을 평가했습니다.',
          };
        }

        /* =========================================================
         * 4. Maximum-Entropy Inverse Reinforcement Learning (IRL)
         * ======================================================= */
        var NAMED_PRESETS = [
          'minimize_harm',
          'passenger_first',
          'rule_compliance',
          'life_expectancy_first',
          'vulnerable_first',
        ];

        function softmaxActionProbs(actions, wNormalized, beta) {
          var utilities = actions.map(function (action) {
            var r = action.risks;
            var weightedRisk =
              wNormalized[0] * r.passenger +
              wNormalized[1] * r.pedestrian +
              wNormalized[2] * r.roadUser +
              wNormalized[3] * r.ruleViolation +
              wNormalized[4] * r.uncertainty +
              wNormalized[5] * r.lifeExpectancy +
              wNormalized[6] * r.vulnerability;
            return -beta * weightedRisk;
          });
          var maxU = Math.max.apply(null, utilities);
          var exps = utilities.map(function (u) {
            return Math.exp(Math.max(-40, Math.min(40, u - maxU)));
          });
          var sumExp =
            exps.reduce(function (a, b) {
              return a + b;
            }, 0) || 1;
          return exps.map(function (e) {
            return e / sumExp;
          });
        }

        function apportionTo100(wNormalized) {
          var raw = wNormalized.map(function (v) {
            return Math.max(0, v) * 100;
          });
          var floored = raw.map(function (v) {
            return Math.floor(v);
          });
          var remainder =
            100 -
            floored.reduce(function (a, b) {
              return a + b;
            }, 0);
          var indexed = raw.map(function (v, idx) {
            return { idx: idx, frac: v - floored[idx] };
          });
          indexed.sort(function (a, b) {
            return b.frac - a.frac;
          });
          for (var i = 0; i < indexed.length && remainder > 0; i++) {
            floored[indexed[i].idx] += 1;
            remainder -= 1;
          }
          return {
            passenger: floored[0],
            pedestrian: floored[1],
            roadUser: floored[2],
            ruleViolation: floored[3],
            uncertainty: floored[4],
            lifeExpectancy: floored[5],
            vulnerability: floored[6],
          };
        }

        function computePresetSimilarityPct(estimated, target) {
          var l1Diff = 0;
          for (var i = 0; i < WEIGHT_KEYS.length; i++) {
            var k = WEIGHT_KEYS[i];
            l1Diff += Math.abs(estimated[k] - target[k]);
          }
          return Number(Math.max(0, 100 - l1Diff / 2).toFixed(1));
        }

        function estimateWeightsFromHumanDecisions(
          humanDecisions,
          customScenarios
        ) {
          var samples = [];
          var uniqueScenarioSet = {};
          var i, k;

          for (i = 0; i < (humanDecisions || []).length; i++) {
            var rec = humanDecisions[i];
            var sc = findScenarioById(rec.scenarioId, customScenarios);
            if (!sc || sc.id !== rec.scenarioId) continue;
            var chosenIndex = -1;
            for (var j = 0; j < sc.actions.length; j++) {
              if (sc.actions[j].id === rec.humanActionId) {
                chosenIndex = j;
                break;
              }
            }
            if (chosenIndex < 0) continue;
            samples.push({ scenario: sc, chosenIndex: chosenIndex });
            uniqueScenarioSet[sc.id] = true;
          }

          var sampleCount = samples.length;
          var uniqueScenarioCount = Object.keys(uniqueScenarioSet).length;

          if (sampleCount === 0) {
            return {
              sampleCount: 0,
              uniqueScenarioCount: 0,
              estimatedWeights: Object.assign(
                {},
                ETHICAL_PRESETS.minimize_harm.weights
              ),
              reproductionAccuracy: 0,
              avgChoiceLikelihood: 0,
              closestPreset: null,
              presetMatches: [],
              confidenceLevel: 'none',
              topFactors: [],
              interpretation:
                '아직 기록된 인간 선택 데이터가 없습니다. 딜레마 시뮬레이터에서 여러 상황을 직접 판단하면 역강화학습으로 윤리 가중치를 추정합니다.',
            };
          }

          var beta = 0.28;
          var priorReg = sampleCount <= 2 ? 0.55 : sampleCount <= 5 ? 0.25 : 0.1;
          var learningRate = 0.08;
          var iterations = 260;

          var w = [1 / 7, 1 / 7, 1 / 7, 1 / 7, 1 / 7, 1 / 7, 1 / 7];

          for (var iter = 0; iter < iterations; iter++) {
            var grad = [0, 0, 0, 0, 0, 0, 0];

            for (i = 0; i < samples.length; i++) {
              var s = samples[i];
              var probs = softmaxActionProbs(s.scenario.actions, w, beta);
              var cr = s.scenario.actions[s.chosenIndex].risks;
              var chosenVec = [
                cr.passenger,
                cr.pedestrian,
                cr.roadUser,
                cr.ruleViolation,
                cr.uncertainty,
                cr.lifeExpectancy,
                cr.vulnerability,
              ];
              var expectedVec = [0, 0, 0, 0, 0, 0, 0];
              for (var aIdx = 0; aIdx < s.scenario.actions.length; aIdx++) {
                var r = s.scenario.actions[aIdx].risks;
                var p = probs[aIdx];
                expectedVec[0] += p * r.passenger;
                expectedVec[1] += p * r.pedestrian;
                expectedVec[2] += p * r.roadUser;
                expectedVec[3] += p * r.ruleViolation;
                expectedVec[4] += p * r.uncertainty;
                expectedVec[5] += p * r.lifeExpectancy;
                expectedVec[6] += p * r.vulnerability;
              }
              for (k = 0; k < 7; k++) {
                grad[k] += beta * (expectedVec[k] - chosenVec[k]);
              }
            }

            for (k = 0; k < 7; k++) {
              grad[k] = grad[k] / sampleCount - priorReg * (w[k] - 1 / 7);
            }

            var nextW = w.map(function (wk, idx) {
              return (
                wk *
                Math.exp(Math.max(-2, Math.min(2, learningRate * grad[idx])))
              );
            });
            var sumNext =
              nextW.reduce(function (a, b) {
                return a + b;
              }, 0) || 1;
            w = nextW.map(function (v) {
              return v / sumNext;
            });
          }

          var estimatedWeights = apportionTo100(w);
          var matchedCount = 0;
          var totalProb = 0;
          var wNormFromInt = WEIGHT_KEYS.map(function (key) {
            return estimatedWeights[key] / 100;
          });

          for (i = 0; i < samples.length; i++) {
            var smp = samples[i];
            var pVec = softmaxActionProbs(
              smp.scenario.actions,
              wNormFromInt,
              beta
            );
            totalProb += pVec[smp.chosenIndex];

            var bestIdx = 0;
            var bestReward = -Infinity;
            for (var ai = 0; ai < smp.scenario.actions.length; ai++) {
              var rw = computeDeterministicReward(
                smp.scenario.actions[ai],
                estimatedWeights
              );
              if (rw > bestReward) {
                bestReward = rw;
                bestIdx = ai;
              }
            }
            if (bestIdx === smp.chosenIndex) matchedCount += 1;
          }

          var reproductionAccuracy = Number(
            ((matchedCount / sampleCount) * 100).toFixed(1)
          );
          var avgChoiceLikelihood = Number(
            ((totalProb / sampleCount) * 100).toFixed(1)
          );

          var presetMatches = NAMED_PRESETS.map(function (pid) {
            return {
              presetId: pid,
              name: ETHICAL_PRESETS[pid].name,
              similarityPct: computePresetSimilarityPct(
                estimatedWeights,
                ETHICAL_PRESETS[pid].weights
              ),
            };
          }).sort(function (a, b) {
            return b.similarityPct - a.similarityPct;
          });

          var closestPreset = presetMatches[0] || null;
          var confidenceLevel =
            uniqueScenarioCount >= 4 && sampleCount >= 5
              ? 'high'
              : sampleCount >= 3
              ? 'medium'
              : 'low';

          var topFactors = WEIGHT_KEYS.map(function (key) {
            return {
              key: key,
              label: WEIGHT_LABELS[key],
              weight: estimatedWeights[key],
            };
          })
            .sort(function (a, b) {
              return b.weight - a.weight;
            })
            .slice(0, 3);

          var f1 = topFactors[0];
          var f2 = topFactors[1];
          var interpretation =
            '지금까지 기록된 ' +
            sampleCount +
            '건(' +
            uniqueScenarioCount +
            "개 시나리오)의 선택을 역강화학습으로 분석한 결과, 사용자는 '" +
            f1.label +
            "'(" +
            f1.weight +
            "%)과 '" +
            f2.label +
            "'(" +
            f2.weight +
            '%) 기준을 가장 높게 반영해 판단하는 경향이 추정되었습니다.' +
            (closestPreset
              ? " 기존 실험 프리셋 중에서는 '" +
                closestPreset.name +
                "'과 가장 유사합니다(유사도 " +
                closestPreset.similarityPct +
                '%).'
              : '');

          return {
            sampleCount: sampleCount,
            uniqueScenarioCount: uniqueScenarioCount,
            estimatedWeights: estimatedWeights,
            reproductionAccuracy: reproductionAccuracy,
            avgChoiceLikelihood: avgChoiceLikelihood,
            closestPreset: closestPreset,
            presetMatches: presetMatches,
            confidenceLevel: confidenceLevel,
            topFactors: topFactors,
            interpretation: interpretation,
          };
        }

        /* =========================================================
         * 5. Safe Storage (localStorage + file:// fallback) & CSV
         * ======================================================= */
        var STORAGE_KEY = 'ethi_drive_lab_state_v3';
        var memoryFallbackStorage = null;

        function safeGetItem(key) {
          try {
            if (window.localStorage) {
              return window.localStorage.getItem(key);
            }
          } catch (e) {}
          return memoryFallbackStorage;
        }

        function safeSetItem(key, val) {
          memoryFallbackStorage = val;
          try {
            if (window.localStorage) {
              window.localStorage.setItem(key, val);
              return true;
            }
          } catch (e) {}
          return false;
        }

        function safeRemoveItem(key) {
          memoryFallbackStorage = null;
          try {
            if (window.localStorage) {
              window.localStorage.removeItem(key);
            }
          } catch (e) {}
        }

        function createInitialTrainingState() {
          return {
            status: 'idle',
            targetEpisodes: 1000,
            currentEpisode: 0,
            currentEpsilon: 1.0,
            avgReward: 0,
            lastTrainedAt: null,
            presetId: 'minimize_harm',
            weights: Object.assign({}, ETHICAL_PRESETS.minimize_harm.weights),
            hyperparameters: {
              learningRate: 0.1,
              discountFactor: 0.9,
              initialEpsilon: 1.0,
              minEpsilon: 0.05,
            },
            qTable: createEmptyQTable(),
            initialQTable: createEmptyQTable(),
            actionCounts: createEmptyActionCounts(),
            episodeHistory: [],
            checkpoints: {
              0: {
                milestone: 0,
                episodeCount: 0,
                qTable: createEmptyQTable(),
                avgReward: 0,
                epsilon: 1.0,
                actionCounts: createEmptyActionCounts(),
                weights: Object.assign(
                  {},
                  ETHICAL_PRESETS.minimize_harm.weights
                ),
                presetId: 'minimize_harm',
                timestamp: new Date().toISOString(),
              },
            },
            humanDecisions: [],
            savedExperiments: [],
            customScenarios: [],
          };
        }

        function loadTrainingState() {
          try {
            var raw = safeGetItem(STORAGE_KEY);
            if (!raw) return createInitialTrainingState();
            var parsed = JSON.parse(raw);
            if (
              !parsed ||
              typeof parsed.currentEpisode !== 'number' ||
              !parsed.qTable
            ) {
              return createInitialTrainingState();
            }
            var base = createInitialTrainingState();
            var customScenarios = Array.isArray(parsed.customScenarios)
              ? parsed.customScenarios
              : [];
            return Object.assign({}, base, parsed, {
              customScenarios: customScenarios,
              weights: Object.assign({}, base.weights, parsed.weights || {}),
              qTable: ensureQTableHasStates(parsed.qTable, customScenarios),
              initialQTable: ensureQTableHasStates(
                parsed.initialQTable || base.initialQTable,
                customScenarios
              ),
              status:
                parsed.status === 'running'
                  ? 'paused'
                  : parsed.status || 'idle',
            });
          } catch (e) {
            return createInitialTrainingState();
          }
        }

        function saveTrainingState(state) {
          try {
            var maxHistory = 1200;
            var compactHistory = state.episodeHistory || [];
            if (compactHistory.length > maxHistory) {
              var step = Math.ceil(compactHistory.length / maxHistory);
              compactHistory = compactHistory.filter(function (_, idx) {
                return idx % step === 0 || idx === compactHistory.length - 1;
              });
            }
            var payload = Object.assign({}, state, {
              episodeHistory: compactHistory,
            });
            return safeSetItem(STORAGE_KEY, JSON.stringify(payload));
          } catch (e) {
            return false;
          }
        }

        function exportExperimentCSV(state) {
          var lines = [];
          lines.push(
            '=== 자율주행 트롤리 딜레마 랩 강화학습 실험 데이터 내보내기 ==='
          );
          lines.push('생성 시각,' + new Date().toISOString());
          lines.push(
            '윤리적 기준,' + ETHICAL_PRESETS[state.presetId].name
          );
          lines.push(
            '가중치(%),탑승자:' +
              state.weights.passenger +
              ',보행자:' +
              state.weights.pedestrian +
              ',주변도로이용자:' +
              state.weights.roadUser +
              ',법규위반:' +
              state.weights.ruleViolation +
              ',불확실성:' +
              state.weights.uncertainty +
              ',연령기대수명:' +
              state.weights.lifeExpectancy +
              ',교통약자보호:' +
              state.weights.vulnerability
          );
          lines.push(
            '하이퍼파라미터,학습률:' +
              state.hyperparameters.learningRate +
              ',할인율:' +
              state.hyperparameters.discountFactor +
              ',초기탐험:' +
              state.hyperparameters.initialEpsilon +
              ',최소탐험:' +
              state.hyperparameters.minEpsilon
          );
          lines.push('누적 에피소드,' + state.currentEpisode);
          lines.push('현재 평균 보상,' + state.avgReward);
          lines.push('');

          lines.push('=== Q-Table (학습 전 vs 현재) ===');
          lines.push(
            '상태(State),행동(Action),학습 전 Q-value,현재 Q-value,변화량(Delta)'
          );
          var stateKeys = Object.keys(state.qTable);
          for (var i = 0; i < stateKeys.length; i++) {
            var sid = stateKeys[i];
            var row = state.qTable[sid];
            var initRow = state.initialQTable[sid];
            var actKeys = Object.keys(row);
            for (var j = 0; j < actKeys.length; j++) {
              var aid = actKeys[j];
              var before = (initRow && initRow[aid]) || 0;
              var after = row[aid] || 0;
              lines.push(
                sid +
                  ',' +
                  aid +
                  ',' +
                  before.toFixed(4) +
                  ',' +
                  after.toFixed(4) +
                  ',' +
                  (after - before).toFixed(4)
              );
            }
          }
          lines.push('');

        /* =========================================================
         * 7. Pure Inline SVG Chart Renderers (Offline Ready)
         * ======================================================= */
        function niceRange(minVal, maxVal) {
          var min = minVal;
          var max = maxVal;
          if (!isFinite(min) || !isFinite(max)) return { min: 0, max: 100 };
          if (Math.abs(max - min) < 1e-6) {
            min = min - 10;
            max = max + 10;
          }
          var pad = (max - min) * 0.1;
          return { min: min - pad, max: max + pad };
        }

        function renderChartLegendHTML(items) {
          return (
            '<div class="flex-row" style="justify-content:center; gap:14px; margin-top:6px; font-size:11px; color:#cbd5e1;">' +
            items
              .map(function (it) {
                return (
                  '<span class="flex-row" style="gap:5px;">' +
                  '<span style="display:inline-block; width:10px; height:10px; border-radius:2px; background:' +
                  it.color +
                  '; opacity:' +
                  (it.opacity || 1) +
                  ';"></span>' +
                  '<span>' +
                  escapeHtml(it.name) +
                  '</span>' +
                  '</span>'
                );
              })
              .join('') +
            '</div>'
          );
        }

        function renderLineChartSVG(data, series, opts) {
          opts = opts || {};
          if (!data || data.length === 0) return '';
          var W = 620;
          var H = 215;
          var padL = 48;
          var padR = 16;
          var padT = 16;
          var padB = 30;
          var plotW = W - padL - padR;
          var plotH = H - padT - padB;

          var allVals = [];
          for (var i = 0; i < data.length; i++) {
            for (var j = 0; j < series.length; j++) {
              var v = Number(data[i][series[j].key]);
              if (isFinite(v)) allVals.push(v);
            }
          }
          var rng = niceRange(
            Math.min.apply(null, allVals),
            Math.max.apply(null, allVals)
          );
          if (typeof opts.minY === 'number') rng.min = opts.minY;
          if (typeof opts.maxY === 'number') rng.max = opts.maxY;
          var spanY = rng.max - rng.min || 1;

          function xAt(idx) {
            if (data.length <= 1) return padL + plotW / 2;
            return padL + (idx / (data.length - 1)) * plotW;
          }
          function yAt(val) {
            return padT + plotH - ((val - rng.min) / spanY) * plotH;
          }

          var svg =
            '<svg viewBox="0 0 ' +
            W +
            ' ' +
            H +
            '" style="width:100%; height:215px; display:block;" role="img" aria-label="추이 그래프">';

          // Grid + Y ticks (4 steps)
          for (var t = 0; t <= 4; t++) {
            var yVal = rng.min + (spanY * t) / 4;
            var yPos = yAt(yVal);
            svg +=
              '<line x1="' +
              padL +
              '" y1="' +
              yPos.toFixed(1) +
              '" x2="' +
              (W - padR) +
              '" y2="' +
              yPos.toFixed(1) +
              '" stroke="#1E293B" stroke-dasharray="3 3" />';
            svg +=
              '<text x="' +
              (padL - 6) +
              '" y="' +
              (yPos + 4).toFixed(1) +
              '" text-anchor="end" fill="#64748B" font-size="10.5" font-family="monospace">' +
              yVal.toFixed(0) +
              (opts.unit || '') +
              '</text>';
          }

          // Zero baseline if inside range
          if (rng.min < 0 && rng.max > 0) {
            var zy = yAt(0);
            svg +=
              '<line x1="' +
              padL +
              '" y1="' +
              zy.toFixed(1) +
              '" x2="' +
              (W - padR) +
              '" y2="' +
              zy.toFixed(1) +
              '" stroke="#334155" stroke-width="1" />';
          }

          // X ticks (up to 5)
          var xStep = Math.max(1, Math.floor((data.length - 1) / 4));
          for (i = 0; i < data.length; i += xStep) {
            svg +=
              '<text x="' +
              xAt(i).toFixed(1) +
              '" y="' +
              (H - 8) +
              '" text-anchor="middle" fill="#64748B" font-size="10.5" font-family="monospace">' +
              escapeHtml(data[i][opts.xKey || 'episode']) +
              '</text>';
          }
          if ((data.length - 1) % xStep !== 0 && data.length > 1) {
            svg +=
              '<text x="' +
              xAt(data.length - 1).toFixed(1) +
              '" y="' +
              (H - 8) +
              '" text-anchor="middle" fill="#64748B" font-size="10.5" font-family="monospace">' +
              escapeHtml(data[data.length - 1][opts.xKey || 'episode']) +
              '</text>';
          }

          // Series paths
          for (j = 0; j < series.length; j++) {
            var s = series[j];
            var pts = [];
            for (i = 0; i < data.length; i++) {
              pts.push(
                xAt(i).toFixed(1) +
                  ',' +
                  yAt(Number(data[i][s.key]) || 0).toFixed(1)
              );
            }
            if (s.area) {
              var areaPts =
                xAt(0).toFixed(1) +
                ',' +
                yAt(rng.min).toFixed(1) +
                ' ' +
                pts.join(' ') +
                ' ' +
                xAt(data.length - 1).toFixed(1) +
                ',' +
                yAt(rng.min).toFixed(1);
              svg +=
                '<polygon points="' +
                areaPts +
                '" fill="' +
                s.color +
                '" fill-opacity="0.18" />';
            }
            svg +=
              '<polyline fill="none" stroke="' +
              s.color +
              '" stroke-width="' +
              (s.width || 2) +
              '" stroke-opacity="' +
              (s.opacity || 1) +
              '" points="' +
              pts.join(' ') +
              '" />';
          }

          // Hover markers (sampled <= 40)
          var dotStep = Math.max(1, Math.floor(data.length / 40));
          for (i = 0; i < data.length; i += dotStep) {
            var d = data[i];
            var tipText =
              '에피소드 ' +
              d[opts.xKey || 'episode'] +
              ': ' +
              series
                .map(function (sr) {
                  return sr.name + ' ' + d[sr.key] + (opts.unit || '');
                })
                .join(' / ');
            var primaryVal = Number(d[series[series.length - 1].key]) || 0;
            svg +=
              '<circle cx="' +
              xAt(i).toFixed(1) +
              '" cy="' +
              yAt(primaryVal).toFixed(1) +
              '" r="4" fill="' +
              series[series.length - 1].color +
              '" fill-opacity="0.01"><title>' +
              escapeHtml(tipText) +
              '</title></circle>';
          }

          svg += '</svg>';
          if (opts.showLegend !== false) {
            svg += renderChartLegendHTML(series);
          }
          return svg;
        }

        function renderStackedBarChartSVG(data, categoryKey, series) {
          if (!data || data.length === 0) return '';
          var W = 620;
          var H = 215;
          var padL = 44;
          var padR = 14;
          var padT = 14;
          var padB = 34;
          var plotW = W - padL - padR;
          var plotH = H - padT - padB;

          var svg =
            '<svg viewBox="0 0 ' +
            W +
            ' ' +
            H +
            '" style="width:100%; height:215px; display:block;" role="img" aria-label="누적 비율 막대 그래프">';

          for (var t = 0; t <= 4; t++) {
            var pct = t * 25;
            var y = padT + plotH - (pct / 100) * plotH;
            svg +=
              '<line x1="' +
              padL +
              '" y1="' +
              y.toFixed(1) +
              '" x2="' +
              (W - padR) +
              '" y2="' +
              y.toFixed(1) +
              '" stroke="#1E293B" stroke-dasharray="3 3" />';
            svg +=
              '<text x="' +
              (padL - 6) +
              '" y="' +
              (y + 4).toFixed(1) +
              '" text-anchor="end" fill="#64748B" font-size="10.5" font-family="monospace">' +
              pct +
              '%</text>';
          }

          var slotW = plotW / data.length;
          var barW = Math.min(48, Math.max(18, slotW * 0.56));

          for (var i = 0; i < data.length; i++) {
            var row = data[i];
            var cx = padL + slotW * (i + 0.5);
            var bx = cx - barW / 2;
            var acc = 0;
            for (var j = 0; j < series.length; j++) {
              var s = series[j];
              var v = Math.max(0, Number(row[s.key]) || 0);
              var segH = (v / 100) * plotH;
              var segY = padT + plotH - ((acc + v) / 100) * plotH;
              if (segH > 0.5) {
                svg +=
                  '<rect x="' +
                  bx.toFixed(1) +
                  '" y="' +
                  segY.toFixed(1) +
                  '" width="' +
                  barW.toFixed(1) +
                  '" height="' +
                  segH.toFixed(1) +
                  '" fill="' +

        function renderGroupedBarChartSVG(data, categoryKey, series, opts) {
          opts = opts || {};
          if (!data || data.length === 0) return '';
          var W = 620;
          var H = 215;
          var padL = 46;
          var padR = 14;
          var padT = 16;
          var padB = 34;
          var plotW = W - padL - padR;
          var plotH = H - padT - padB;

          var allVals = [0];
          for (var i = 0; i < data.length; i++) {
            for (var j = 0; j < series.length; j++) {
              var v = Number(data[i][series[j].key]);
              if (isFinite(v)) allVals.push(v);
            }
          }
          var minV = Math.min.apply(null, allVals);
          var maxV = Math.max.apply(null, allVals);
          if (typeof opts.minY === 'number') minV = opts.minY;
          if (typeof opts.maxY === 'number') maxV = opts.maxY;
          if (Math.abs(maxV - minV) < 1e-5) maxV = minV + 10;
          var padRange = opts.fixedDomain ? 0 : (maxV - minV) * 0.1;
          var lo = opts.fixedDomain ? minV : minV - padRange;
          var hi = opts.fixedDomain ? maxV : maxV + padRange;
          if (lo > 0) lo = 0;
          var span = hi - lo || 1;

          function yAt(val) {
            return padT + plotH - ((val - lo) / span) * plotH;
          }
          var zeroY = yAt(0);

          var svg =
            '<svg viewBox="0 0 ' +
            W +
            ' ' +
            H +
            '" style="width:100%; height:215px; display:block;" role="img" aria-label="비교 막대 그래프">';

          for (var t = 0; t <= 4; t++) {
            var yVal = lo + (span * t) / 4;
            var y = yAt(yVal);
            svg +=
              '<line x1="' +
              padL +
              '" y1="' +
              y.toFixed(1) +
              '" x2="' +
              (W - padR) +
              '" y2="' +
              y.toFixed(1) +
              '" stroke="#1E293B" stroke-dasharray="3 3" />';
            svg +=
              '<text x="' +
              (padL - 6) +
              '" y="' +
              (y + 4).toFixed(1) +
              '" text-anchor="end" fill="#64748B" font-size="10.5" font-family="monospace">' +
              yVal.toFixed(0) +
              (opts.unit || '') +
              '</text>';
          }

          svg +=
            '<line x1="' +
            padL +
            '" y1="' +
            zeroY.toFixed(1) +
            '" x2="' +
            (W - padR) +
            '" y2="' +
            zeroY.toFixed(1) +
            '" stroke="#334155" stroke-width="1" />';

          var slotW = plotW / data.length;
          var groupW = slotW * 0.72;
          var barGap = 2;
          var barW = Math.max(
            6,
            Math.min(28, (groupW - barGap * (series.length - 1)) / series.length)
          );
          var actualGroupW =
            barW * series.length + barGap * (series.length - 1);

          for (i = 0; i < data.length; i++) {
            var row = data[i];
            var cx = padL + slotW * (i + 0.5);
            var startX = cx - actualGroupW / 2;

            for (j = 0; j < series.length; j++) {
              var s = series[j];
              var val = Number(row[s.key]) || 0;
              var vy = yAt(val);
              var rectY = Math.min(zeroY, vy);
              var rectH = Math.max(1.5, Math.abs(zeroY - vy));
              var bx = startX + j * (barW + barGap);
              svg +=
                '<rect x="' +
                bx.toFixed(1) +
                '" y="' +
                rectY.toFixed(1) +
                '" width="' +
                barW.toFixed(1) +
                '" height="' +
                rectH.toFixed(1) +
                '" rx="2" fill="' +
                s.color +
                '">' +
                '<title>' +
                escapeHtml(
                  row[categoryKey] +
                    ' · ' +
                    s.name +
                    ': ' +
                    val +
                    (opts.unit || '')
                ) +
                '</title></rect>';
            }

            var lbl = String(row[categoryKey] || '');
            if (lbl.length > 9 && data.length >= 5) {
              lbl = lbl.slice(0, 8) + '…';
            }
            svg +=
              '<text x="' +
              cx.toFixed(1) +
              '" y="' +
              (H - 10) +
              '" text-anchor="middle" fill="#94A3B8" font-size="10">' +
              escapeHtml(lbl) +
              '</text>';
          }

          svg += '</svg>';
          svg += renderChartLegendHTML(series);
          return svg;
        }

        /* =========================================================

        function renderBreakdownTableHTML(opts) {
          var scenario = opts.scenario;
          var weights = opts.weights;
          var presetId = opts.presetId;
          var qTable = opts.qTable;
          var discountFactor = opts.discountFactor;
          var winningActionId = opts.winningActionId;
          var untrained = opts.untrained;

          var presetName = ETHICAL_PRESETS[presetId].name;
          var actionSummaries = scenario.actions.map(function (action) {
            return {
              action: action,
              weightedRisk: computeWeightedRisk(action.risks, weights),
              immediateReward: computeDeterministicReward(action, weights),
              expectedReturn: computeExpectedRewardFromPolicy(
                scenario.stateId,
                action,
                weights,
                qTable,
                discountFactor
              ),
              qVal: (qTable[scenario.stateId] && qTable[scenario.stateId][action.id]) || 0,
            };
          });

          var winnerSummary = actionSummaries.find(function (s) {
            return s.action.id === winningActionId;
          });
          var runnerUpSummary = null;
          if (winnerSummary) {
            var others = actionSummaries
              .filter(function (s) {
                return s.action.id !== winnerSummary.action.id;
              })
              .sort(function (a, b) {
                return untrained
                  ? b.expectedReturn - a.expectedReturn
                  : b.qVal - a.qVal;
              });
            runnerUpSummary = others[0] || null;
          }

          var decisiveNote = '';
          if (winnerSummary && runnerUpSummary && !untrained) {
            if (winnerSummary.action.nextState) {
              decisiveNote =
                "현재 설정된 '" +
                presetName +
                "' 기준에서 '" +
                winnerSummary.action.shortLabel +
                "'은 추가 센서 확인(시간 비용 -" +
                winnerSummary.action.stepCost +
                ') 후 불확실성을 낮춘 다음 상태 보상(할인율 γ=' +
                discountFactor.toFixed(2) +
                ')까지 합산한 기대 수익(' +
                winnerSummary.expectedReturn.toFixed(2) +
                ')이 가장 높아 최적 행동으로 평가되었습니다.';
            } else {
              var bestDiff = -Infinity;
              var bestKey = 'pedestrian';
              WEIGHT_KEYS.forEach(function (k) {
                var wp = (winnerSummary.action.risks[k] * weights[k]) / 100;
                var rp = (runnerUpSummary.action.risks[k] * weights[k]) / 100;
                if (rp - wp > bestDiff) {
                  bestDiff = rp - wp;
                  bestKey = k;
                }
              });
              var wpVal = (
                (winnerSummary.action.risks[bestKey] * weights[bestKey]) /
                100
              ).toFixed(2);
              var rpVal = (
                (runnerUpSummary.action.risks[bestKey] * weights[bestKey]) /
                100
              ).toFixed(2);
              decisiveNote =
                "'" +
                presetName +
                "' 기준에서 '" +
                winnerSummary.action.shortLabel +
                "'의 총 가중 감점 합계는 " +
                winnerSummary.weightedRisk.toFixed(2) +
                "점으로 '" +
                runnerUpSummary.action.shortLabel +
                "'(" +
                runnerUpSummary.weightedRisk.toFixed(2) +
                "점)보다 낮습니다. 특히 '" +
                WEIGHT_LABELS[bestKey] +
                "'(가중치 " +
                weights[bestKey] +
                '%) 항목의 감점이 ' +
                wpVal +
                '점 vs ' +
                rpVal +
                '점으로 갈리며, 학습된 Q-value(' +
                fmtSigned(winnerSummary.qVal, 2) +
                ')가 가장 높게 수렴했습니다.';
            }
          }

          var headerCols = actionSummaries
            .map(function (s) {
              var isWinner = !untrained && winningActionId === s.action.id;
              return (
                '<th style="text-align:right;' +
                (isWinner ? 'background:rgba(34,211,238,0.1);color:#67e8f9;' : 'color:#e2e8f0;') +
                '">' +
                escapeHtml(s.action.shortLabel) +
                (isWinner
                  ? ' <span style="font-size:11px;font-weight:400;color:#22d3ee;">(AI 선택)</span>'
                  : '') +
                '</th>'
              );
            })
            .join('');

          var bodyRows = WEIGHT_KEYS.map(function (key) {
            var wp = weights[key];
            var cells = actionSummaries
              .map(function (s) {
                var isWinner = !untrained && winningActionId === s.action.id;
                var raw = s.action.risks[key];
                var pen = (raw * wp) / 100;
                return (
                  '<td class="font-mono-tabular" style="text-align:right;' +
                  (isWinner ? 'background:rgba(34,211,238,0.05);color:#f1f5f9;' : 'color:#cbd5e1;') +
                  '">' +
                  '<span style="color:#64748b;">' +
                  raw +
                  ' × </span>' +
                  '<span>' +
                  wp +
                  '%</span>' +
                  '<span style="margin-left:6px;font-weight:600;color:#fda4af;">(-' +
                  pen.toFixed(2) +
                  ')</span></td>'
                );
              })
              .join('');

            return (
              '<tr>' +
              '<td style="color:#cbd5e1;">' +
              escapeHtml(WEIGHT_LABELS[key]) +
              '</td>' +
              '<td class="font-mono-tabular text-cyan" style="text-align:right;">' +
              wp +
              '%</td>' +
              cells +
              '</tr>'
            );
          }).join('');

          var sumRow =
            '<tr style="border-top:1px solid #334155; background:#060a12;">' +
            '<td colspan="2" style="font-weight:600; color:#fff;">총 가중 위험 감점 합계 (낮을수록 유리)</td>' +
            actionSummaries

                return (

                  (isWinner ? 'background:rgba(34,211,238,0.1);color:#a5f3fc;' : 'color:#e2e8f0;') +

                    : '-' + s.weightedRisk.toFixed(2)) +
                  '</td>'
                );
              })
              .join('') +
            '</tr>';

          var expectedRow =
            '<tr style="background:#060a12;">' +
            '<td colspan="2" style="font-weight:500; color:#cbd5e1;">기준 예상 보상 (50 - 감점 합계 / 다음 상태 포함)</td>' +
            actionSummaries
              .map(function (s) {
                var isWinner = !untrained && winningActionId === s.action.id;
                return (
                  '<td class="font-mono-tabular" style="text-align:right;font-weight:600;' +
                  (isWinner ? 'background:rgba(34,211,238,0.1);color:#6ee7b7;' : 'color:#cbd5e1;') +
                  '">' +
                  fmtSigned(s.expectedReturn, 2) +
                  '</td>'
                );
              })
              .join('') +
            '</tr>';

          var qRow =
            '<tr style="border-top:1px solid #334155; background:#080f1e;">' +
            '<td colspan="2" style="font-weight:700; color:#fff;">실제 학습된 Q-value (최종 선택 기준)</td>' +
            actionSummaries
              .map(function (s) {
                var isWinner = !untrained && winningActionId === s.action.id;
                return (
                  '<td class="font-mono-tabular" style="text-align:right;font-size:13px;font-weight:700;' +
                  (isWinner ? 'background:rgba(34,211,238,0.15);color:#67e8f9;' : 'color:#94a3b8;') +
                  '">' +
                  fmtSigned(s.qVal, 2) +
                  '</td>'
                );
              })
              .join('') +
            '</tr>';

          return (
            '<section class="panel">' +
            '<div class="flex-between divider-bottom" style="margin-bottom:14px;">' +
            '<div class="flex-row" style="color:#fff;">' +
            '<span class="text-cyan">' +
            ICONS.calc +
            '</span>' +
            '<h3 style="margin:0; font-size:15px; font-weight:600;">AI 의사결정 수치 합산 및 보상 산출 근거표</h3>' +
            '</div>' +
            '<span class="font-mono-tabular text-muted" style="font-size:12px;">산식: 보상 = 50 - Σ(항목 점수 × 가중치%) · 기준: ' +
            escapeHtml(presetName) +
            '</span></div>' +
            (decisiveNote
              ? '<div class="banner banner-cyan" style="margin-bottom:14px; line-height:1.6;">' +
                escapeHtml(decisiveNote) +
                '</div>'
              : '') +
            (untrained
              ? '<div class="banner banner-amber" style="margin-bottom:14px; line-height:1.6;">아직 강화학습이 완료되지 않아 실제 학습 Q-value는 모두 0.00입니다. 아래 표는 현재 설정된 \'' +
                escapeHtml(presetName) +
                '\' 가중치로 학습할 경우 각 선택지가 받게 될 이론적 감점 합계와 보상 구조를 미리 보여줍니다.</div>'

            '<div class="table-wrap"><table style="min-width:720px;">' +
            '<thead><tr><th>평가 항목</th><th style="text-align:right;">가중치</th>' +

            '</tr></thead>' +
            '<tbody>' +
            bodyRows +
            sumRow +
            expectedRow +
            qRow +

        function renderAnalyticsView() {
          var allScenarios = getAllScenarios(state.customScenarios);
          var selectedScenario = findScenarioById(
            ui.chartScenarioId,
            state.customScenarios
          );
          var irl = estimateWeightsFromHumanDecisions(
            state.humanDecisions,
            state.customScenarios
          );
          var hasTraining = state.episodeHistory.length > 0;
          var currentUntrained = isQTableUntrainedForState(
            selectedScenario.stateId,
            state.qTable
          );

          function emptyNotice(msg, target) {
            return (
              '<div class="empty-box"><p class="text-muted" style="margin:0; max-width:340px; font-size:12px; line-height:1.55;">' +
              escapeHtml(msg) +
              '</p><button type="button" class="btn btn-secondary btn-sm" data-nav="' +
              (target || 'training') +
              '">' +
              (target === 'simulator'
                ? '딜레마 시뮬레이터로 이동'
                : ICONS.sliders + '<span>AI 학습실로 이동</span>') +
              '</button></div>'
            );
          }

          var hist = state.episodeHistory;
          var step = Math.max(1, Math.ceil(hist.length / 100));
          var episodeSeries = hist
            .filter(function (_, idx) {
              return idx % step === 0 || idx === hist.length - 1;
            })
            .map(function (m) {
              return {
                episode: m.episode,
                reward: m.reward,
                avgReward: m.avgReward,
                epsilonPct: Number((m.epsilon * 100).toFixed(1)),
              };
            });

          var filtered = hist.filter(function (m) {
            return m.scenarioId === selectedScenario.id;
          });
          var actionRatioSeries = [];
          if (filtered.length > 0) {
            var bucketCount = Math.min(5, filtered.length);
            var bucketSize = Math.ceil(filtered.length / bucketCount);
            for (var b = 0; b < bucketCount; b++) {
              var slice = filtered.slice(b * bucketSize, (b + 1) * bucketSize);
              if (slice.length === 0) continue;
              var row = {
                stage:
                  slice[0].episode + '~' + slice[slice.length - 1].episode + '회',
              };
              selectedScenario.actions.forEach(function (a) {
                var cnt = slice.filter(function (m) {
                  return m.actionId === a.id;
                }).length;
                row[a.shortLabel] = Number(
                  ((cnt / slice.length) * 100).toFixed(1)
                );
              });
              actionRatioSeries.push(row);
            }
          }

          var qCompData = currentUntrained
            ? []
            : selectedScenario.actions.map(function (a) {
                return {
                  action: a.shortLabel,
                  beforeQ: Number(
                    (
                      (state.initialQTable[selectedScenario.stateId] &&
                        state.initialQTable[selectedScenario.stateId][a.id]) ||
                      0
                    ).toFixed(2)
                  ),
                  afterQ: Number(
                    (
                      (state.qTable[selectedScenario.stateId] &&
                        state.qTable[selectedScenario.stateId][a.id]) ||
                      0
                    ).toFixed(2)
                  ),
                };
              });

          var ethicalCompData = [
            'minimize_harm',
            'passenger_first',
            'rule_compliance',
            'life_expectancy_first',
            'vulnerable_first',
          ].map(function (pid) {
            var preset = ETHICAL_PRESETS[pid];
            var saved = state.savedExperiments.find(function (e) {
              return e.presetId === pid;
            });
            var row = { preset: preset.name.replace('형', '') };
            selectedScenario.actions.forEach(function (a) {
              row[a.shortLabel] = saved
                ? Number(
                    (
                      (saved.qTable[selectedScenario.stateId] &&
                        saved.qTable[selectedScenario.stateId][a.id]) ||
                      0
                    ).toFixed(2)
                  )
                : computeDeterministicReward(a, preset.weights);
            });
            return row;
          });

          var comparable = state.humanDecisions.filter(function (d) {
            return d.agreed !== null;
          });
          var agreementData = null;
          if (comparable.length > 0) {
            var totalAgreed = comparable.filter(function (d) {
              return d.agreed;
            }).length;
            var perScenario = allScenarios
              .map(function (sc) {
                var items = comparable.filter(function (d) {
                  return d.scenarioId === sc.id;
                });
                var ag = items.filter(function (d) {
                  return d.agreed;
                }).length;
                return {
                  scenario: sc.code,
                  rate:
                    items.length > 0
                      ? Number(((ag / items.length) * 100).toFixed(1))
                      : 0,
                  count: items.length,
                };
              })
              .filter(function (x) {
                return x.count > 0;
              });
            agreementData = {
              overallRate: Number(
                ((totalAgreed / comparable.length) * 100).toFixed(1)
              ),
              perScenario: perScenario,

                actors: [

        /* =========================================================
         * 13. Full Render & Training Loop Control
         * ======================================================= */
        function renderAlert() {
          var el = document.getElementById('alert-area');
          if (!el) return;

          }

        function updateNavChrome() {
          var navButtons = document.querySelectorAll('[data-nav]');
          for (var i = 0; i < navButtons.length; i++) {
            var btn = navButtons[i];
            if (
              btn.classList.contains('nav-link') ||
              btn.classList.contains('mobile-nav-item')
            ) {
              btn.classList.toggle(
                'active',
                btn.getAttribute('data-nav') === ui.activeTab
              );

          }

              ui.activeTab === 'simulator'
                ? 'AI 학습실 열기'

          var drawer = document.getElementById('mobile-drawer');
